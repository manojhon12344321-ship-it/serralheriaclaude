const $ = id => document.getElementById(id);
const fmt = (n, d = 2) => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const brl = n => 'R$' + fmt(n);
const r2 = x => Math.round(x * 100 + (x >= 0 ? 1e-6 : -1e-6)) / 100;
const r3 = x => Math.round(x * 1000 + (x >= 0 ? 1e-7 : -1e-7)) / 1000;
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hoje() { return new Date(); }
function dataBR(iso) { if (!iso) return 'a Combinar'; const p = String(iso).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function hojeBR() { const d = hoje(); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
function maskPhone(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  let o = '';
  if (d.length) o = '(' + d.slice(0, 2);
  if (d.length >= 3) {
    o += ')';
    const rest = d.slice(2);
    const cut = rest.length > 8 ? 5 : 4;
    o += rest.length > cut ? rest.slice(0, cut) + '-' + rest.slice(cut) : rest;
  }
  el.value = o;
}

/* =========================================================

const dot = k => { const a = ACAB_BY[k]; return `<span class="dot" style="background:${a ? a.cor : '#fff'}"></span>`; };

const LINHAS = [['MG25', 'MG25'], ['SU490', 'SU490'], ['APV001', 'APV001'], ['2080', '2080'], ['Suprema', 'SU'], ['Gold', 'GO'], ['FA350', 'FA350'], ['MG16', 'MG16'], ['MG20', 'MG20'], ['MG32', 'MG32'], ['ISU490', 'ISU490']];

function sortearAcab(r) {
  const x = r();
  if (x < 0.45) return 'BR';
  if (x < 0.60) return 'BF';
  if (x < 0.74) return 'PT';
  if (x < 0.86) return 'BZ';
  if (x < 0.93) return 'AM';
  return 'BG';
}

/* ---------- 2145 PERFIS (11 linhas x 195 perfis) ---------- */
const PERFIS = (function () {
  const r = mulberry32(20262145);
  const out = [];
  LINHAS.forEach(([linha, pref], li) => {
    let n = 0;
    for (let k = 0; k < 195; k++) {
      n += (linha === 'MG25') ? 1 : 1 + (r() < 0.25 ? Math.floor(r() * 4) : 0);
      const cod = pref + '-' + String(n).padStart(3, '0');
      const nm = NOMES_PERFIS[(k * 7 + li * 5 + Math.floor(r() * 3)) % NOMES_PERFIS.length];
      const kgBarra = r2(0.5 + r() * 4.5);
      const barLen = r() < 0.8 ? 6000 : 5800;
      out.push({ cod, nome: nm[0], cat: nm[1], linha, acab: sortearAcab(r), kgBarra, kgm: r2(kgBarra / (barLen / 1000)), barLen, seed: li * 1000 + k + 1, sug: 45.03, unit: 'KG' });
    }
  });
  const over = {
    'MG25-016': { nome: 'Marco inferior 2 planos', cat: 'Marcos', kgm: 0.78, kgBarra: 4.72, acab: 'BR', barLen: 6000 },

  };
  const first = [];
  ['MG25-016', 'MG25-118', 'MG25-101'].forEach(c => {
    const i = out.findIndex(p => p.cod === c);
    Object.assign(out[i], over[c]);
    first.push(out.splice(i, 1)[0]);
  });
  return first.concat(out);
})();

/* =========================================================
   MOTOR DE CÁLCULO DA TIPOLOGIA
   ========================================================= */
function calcTipologia(tip, p) {
  const L = num(p.L), H = num(p.H), n = tip.n;
  const pref = LINHA_PREF[p.linha] || 'SU';
  const fat = LINHA_FATOR[p.linha] || 1;
  const perfis = [];
  const addPerfil = (cod, d, kgm, pecas) => {
    const qtd = pecas.reduce((s, x) => s + x[0], 0);
    const tot = pecas.reduce((s, x) => s + x[0] * x[1], 0);
    const barras = Math.ceil(tot / 6000 - 1e-9);
    const k = kgm * KS * fat;
    perfis.push({ cod, d, qtd, corte: pecas.map(x => x[1]).join(' / '), barras, kgObra: tot / 1000 * k, kgCompra: barras * 6 * k });
  };
  addPerfil(pref + '001', 'Marco superior', 0.55, [[1, L]]);
  addPerfil(pref + '002', 'Marco inferior 2 planos', 0.75, [[1, L]]);
  addPerfil(pref + '003', 'Marco lateral', 0.60, [[2, H]]);
  addPerfil(pref + '004', 'Folha montante lateral', 0.45, [[n, H - 40]]);
  addPerfil(pref + '005', 'Folha montante encontro', 0.50, [[n, H - 40]]);
  addPerfil(pref + '006', 'Folha travessa superior', 0.40, [[n, Math.round(L / n)]]);
  addPerfil(pref + '007', 'Folha travessa inferior', 0.40, [[n, Math.round(L / n)]]);
  const vw = Math.round((L - 152) / n), vh = H - 39;
  if (tip.bag) addPerfil(pref + '053', 'Baguete reto', 0.075621, [[2 * n, vw], [2 * n, vh]]);
  if (ARREMATES[p.arremate]) addPerfil(p.arremate, 'Arremate ' + p.arremate, ARREMATES[p.arremate], [[2, L + 50], [2, H + 50]]);
  if (CONTRAMARCOS[p.contramarco]) addPerfil(p.contramarco, 'Contramarco ' + p.contramarco, CONTRAMARCOS[p.contramarco], [[2, L + 10], [2, H + 10]]);

  const comps = [];
  COMPS.forEach(c => {
    if (c.bag && !tip.bag) return;
    if (c.correr && tip.tipo !== 'correr') return;
    let base = c;
    if (c.s === 'fecho') base = FECHOS[p.fecho] || FECHOS['TRAVA SEM CHAVE'];
    let q = c.q;
    if (c.s === 'n') q = c.q * n / 2;
    else if (c.s === 'p') q = c.q * (L + H) / 2900;
    comps.push({ c: base.c, d: base.d, u: c.u, qtd: r3(q), emb: base.emb || c.emb, sug: base.sug });
  });

  const esp = parseInt(p.vidroEsp, 10) || 6;
  const vcod = (VIDRO_PREF[p.vidroTipo] || 'TEMPINC') + esp;
  const m2 = n * vw * vh / 1e6;
  const vidros = [{ c: vcod, d: (VIDROS_CAT[vcod] || { d: 'Vidro' }).d, qtd: n, w: vw, h: vh, m2, kg: m2 * esp * 2.5, sug: (VIDROS_CAT[vcod] || { sug: 0 }).sug }];

  return {
    perfis, comps, vidros,
    kgObra: perfis.reduce((s, x) => s + x.kgObra, 0),
    kgCompra: perfis.reduce((s, x) => s + x.kgCompra, 0),
    m2Total: L * H / 1e6
  };
}

/* =========================================================
   MATERIAIS E ORÇAMENTO DA OBRA
   ========================================================= */
function materiaisObra(obra) {
  const P = {}, C = {}, V = {};
  let m2Esq = 0, pecas = 0;
  const pk = preco('PERFIL_KG', 45.03);
  const custoTip = [];
  obra.tipologias.forEach(t => {
    const tip = TIP_BY[t.tip];
    const res = calcTipologia(tip, t.params);
    const q = num(t.qtd) || 1;
    pecas += q;
    m2Esq += res.m2Total * q;
    let ct = res.kgObra * pk;
    res.perfis.forEach(x => {
      const a = P[x.cod] || (P[x.cod] = { cod: x.cod, d: x.d, kgObra: 0, kgCompra: 0, barras: 0, qtd: 0 });
      a.kgObra += x.kgObra * q; a.kgCompra += x.kgCompra * q; a.barras += x.barras * q; a.qtd += x.qtd * q;
    });
    res.comps.forEach(x => {
      const a = C[x.c] || (C[x.c] = { c: x.c, d: x.d, u: x.u, emb: x.emb, sug: x.sug, qtd: 0 });
      a.qtd += x.qtd * q;
      ct += x.qtd * q * preco(x.c, x.sug);
    });
    res.vidros.forEach(x => {
      const a = V[x.c] || (V[x.c] = { c: x.c, d: x.d, sug: x.sug, m2: 0, kg: 0, pcs: 0 });
      a.m2 += x.m2 * q; a.kg += x.kg * q; a.pcs += x.qtd * q;
      ct += x.m2 * q * preco(x.c, x.sug);
    });
    custoTip.push(ct);
  });
  const perfis = Object.values(P);
  const kgObra = r3(perfis.reduce((s, x) => s + x.kgObra, 0));
  const kgCompra = r3(perfis.reduce((s, x) => s + x.kgCompra, 0));
  const comps = Object.values(C).map(a => {
    a.qtd = r3(a.qtd);
    a.compraQtd = Math.ceil(a.qtd / a.emb - 1e-9) * a.emb;
    a.preco = preco(a.c, a.sug);
    a.vObra = a.qtd * a.preco;
    a.vCompra = a.compraQtd * a.preco;
    return a;
  });
  const vidros = Object.values(V).map(a => { a.preco = preco(a.c, a.sug); a.valor = r2(a.m2 * a.preco); return a; });
  const m2Vidro = vidros.reduce((s, x) => s + x.m2, 0);
  return {
    perfis, comps, vidros, kgObra, kgCompra, m2Esq, m2Vidro, pecas, custoTip, precoKg: pk,
    perfisObra: r2(kgObra * pk), perfisCompra: r2(kgCompra * pk),
    compsObra: r2(comps.reduce((s, x) => s + x.vObra, 0)), compsCompra: r2(comps.reduce((s, x) => s + x.vCompra, 0)),
    vidrosTotal: r2(vidros.reduce((s, x) => s + x.valor, 0))
  };
}
function orcCalc(obra) {
  const m = materiaisObra(obra);
  const o = obra.orc;
  const perf = o.modoPerfis === 'compra' ? m.perfisCompra : m.perfisObra;
  const comp = o.modoComps === 'compra' ? m.compsCompra : m.compsObra;
  const mat = r2(perf + comp + m.vidrosTotal);
  const prod = r2((o.prodModo === 'bruto' ? m.kgCompra : m.kgObra) * num(o.custoKg));
  const instBase = o.instModo === 'KG' ? m.kgObra : o.instModo === 'M2' ? m.m2Esq : m.pecas;
  const inst = r2(instBase * num(o.custoInst));
  const custo = r2(mat + prod + inst);
  const lucro = r2(custo * num(o.margem) / 100);
  const imp = Math.min(Math.max(num(o.impostos), 0), 95);
  const bruto = r2(custo + lucro);
  const impostos = r2(bruto / (1 - imp / 100) - bruto);
  const precoFinal = r2(bruto + impostos);
  const somaCt = m.custoTip.reduce((s, x) => s + x, 0);
  let acum = 0;
  const itens = obra.tipologias.map((t, i) => {
    let v;
    if (i === obra.tipologias.length - 1) v = r2(precoFinal - acum);
    else { v = r2(somaCt > 0 ? precoFinal * m.custoTip[i] / somaCt : precoFinal / obra.tipologias.length); acum = r2(acum + v); }
    const desc = num(t.desconto);
    return { idx: i, tip: TIP_BY[t.tip], qtd: num(t.qtd) || 1, valor: v, desconto: desc, subtotal: r2(v - desc) };
  });
  const descTotal = r2(itens.reduce((s, x) => s + x.desconto, 0));
  return { ...m, perf, comp, mat, prod, inst, custo, lucro, impostos, preco: precoFinal, itens, descTotal, total: r2(precoFinal - descTotal), lucroImp: r2(lucro + impostos), matCompra: r2(m.perfisCompra + m.compsCompra + m.vidrosTotal), matObra: r2(m.perfisObra + m.compsObra + m.vidrosTotal) };
}

function janelaSVG(tip, w = 140, h = 100) {
  const n = tip.n, X = 9, Y = 9, W = 122, H = 82;
  let s = `<svg viewBox="0 0 140 100" width="${w}" height="${h}"><rect x="2" y="2" width="136" height="96" fill="#cfd6dc" stroke="#2C3E50" stroke-width="2"/>`;
  const pw = W / n;
  for (let i = 0; i < n; i++) {
    const px = X + i * pw;
    s += `<rect x="${px + 2}" y="${Y + 2}" width="${pw - 4}" height="${H - 4}" fill="#e8eef2" stroke="#2C3E50" stroke-width="1.5"/>`;
    s += `<rect x="${px + 7}" y="${Y + 7}" width="${pw - 14}" height="${H - 14}" fill="#bfe3f5" stroke="#2C3E50" stroke-width="1"/>`;
    s += `<path d="M${px + 12} ${Y + H - 18}L${px + pw * 0.45} ${Y + 14}" stroke="#fff" stroke-width="2" opacity=".8"/>`;
    if (tip.tipo === 'correr') {
      const dir = i % 2 === 0 ? 1 : -1, cy = Y + H / 2, a = px + pw / 2 - 12 * dir, b = px + pw / 2 + 12 * dir;
      s += `<path d="M${a} ${cy}L${b} ${cy}M${b} ${cy}L${b - 5 * dir} ${cy - 4}M${b} ${cy}L${b - 5 * dir} ${cy + 4}" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    } else if (tip.tipo === 'maxim') {
      s += `<path d="M${px + 7} ${Y + H - 7}L${px + pw / 2} ${Y + 7}L${px + pw - 7} ${Y + H - 7}" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>`;
    } else if (tip.tipo === 'giro') {
      const hx = i % 2 === 0 ? px + 7 : px + pw - 7, ox = i % 2 === 0 ? px + pw - 7 : px + 7;
      s += `<path d="M${hx} ${Y + 7}L${ox} ${Y + H / 2}L${hx} ${Y + H - 7}" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>`;
    } else {
      s += `<path d="M${px + 7} ${Y + 7}L${px + pw - 7} ${Y + H - 7}M${px + pw - 7} ${Y + 7}L${px + 7} ${Y + H - 7}" stroke="#2C3E50" stroke-width="1" opacity=".5"/>`;
    }
  }
  return s + '</svg>';
}

   ========================================================= */
let _modalSave = null;
function openModal(title, body, onSave, opts = {}) {
  _modalSave = onSave || null;
  $('modal-root').innerHTML = `
  <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-lg shadow-2xl w-full ${opts.wide ? 'max-w-3xl' : 'max-w-md'} max-h-[92vh] flex flex-col">
      <div class="px-5 py-3 border-b font-bold text-gray-700 flex items-center justify-between">${title}<button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-xl leading-none">&times;</button></div>
      <div class="p-5 overflow-y-auto">${body}</div>
      <div class="px-5 py-3 border-t flex justify-end gap-2">
        <button onclick="closeModal()" class="btn btn-ghost">${opts.closeLabel || 'FECHAR'}</button>
        ${onSave ? `<button onclick="modalSave()" class="btn btn-teal">${opts.saveLabel || 'SALVAR'}</button>` : ''}
      </div>
    </div>
  </div>`;
  setTimeout(() => { const f = $('modal-root').querySelector('input:not([readonly]),textarea,select'); if (f) f.focus(); }, 60);
}
function modalSave() { if (_modalSave) { const fn = _modalSave; if (fn() !== false) closeModal(); } }
function closeModal() { $('modal-root').innerHTML = ''; _modalSave = null; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && _modalSave && e.target.tagName === 'INPUT') { e.preventDefault(); modalSave(); }
});

function toast(msg, tipo = 'ok') {
  const d = document.createElement('div');
  const cor = tipo === 'ok' ? '#2ECC71' : tipo === 'info' ? '#1E88E5' : '#e74c3c';
  d.className = 'toast pointer-events-auto w-full text-white font-semibold text-sm rounded-lg shadow-lg px-4 py-3 flex items-center justify-between gap-3';
  d.style.background = cor;
  d.innerHTML = `<span>${esc(msg)}</span><button class="font-bold text-xs opacity-90 hover:opacity-100">FECHAR</button>`;
  d.querySelector('button').onclick = () => d.remove();
  $('toast-root').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transform = 'translateY(-8px)'; setTimeout(() => d.remove(), 320); }, 3000);
}

function toggleDD(e, id) {
  e.stopPropagation();
  document.querySelectorAll('.dd').forEach(el => { if (el.id !== id) el.classList.add('hidden'); });
  $(id).classList.toggle('hidden');
  if (id === 'notifDD') $('bellDot').style.display = 'none';
}
document.addEventListener('click', () => document.querySelectorAll('.dd').forEach(el => el.classList.add('hidden')));

let deskCollapsed = false, mobOpen = false;
function isDesk() { return window.innerWidth >= 1024; }
function applySidebar() {
  const desk = isDesk();
  const open = desk ? !deskCollapsed : mobOpen;
  $('sidebar').style.transform = open ? 'translateX(0)' : 'translateX(-100%)';
  $('wrap').style.paddingLeft = desk && open ? '16rem' : '0';
  $('overlay').style.display = !desk && open ? 'block' : 'none';
}
function toggleSidebar() { if (isDesk()) deskCollapsed = !deskCollapsed; else mobOpen = !mobOpen; applySidebar(); }
function closeSidebarMobile() { mobOpen = false; applySidebar(); }
window.addEventListener('resize', applySidebar);

let bannerVerdeVisivel = true;
function renderBanners() {
  let h = '';
  if (!DB.verificado) h += `<div class="bg-[#E3F2FD] text-[#0D47A1] text-sm px-4 py-2 flex flex-wrap items-center justify-between gap-2 border-b border-blue-200"><span><b>Proteja sua conta</b></span><button onclick="modalVerificar()" class="font-semibold underline">Verificar e-mail/telefone</button></div>`;
  $('banners').innerHTML = h;
}
function modalVerificar() {
  openModal('Proteja sua conta', `
    <p class="text-sm text-gray-600">Confirme seu e-mail e telefone para recuperar o acesso em caso de perda de senha.</p>
    <label class="lbl">E-mail</label><input id="vfEmail" type="email" class="inp" placeholder="seuemail@gmail.com">
    <label class="lbl">Telefone</label><input id="vfTel" class="inp" inputmode="numeric" placeholder="(73)99978-8982" oninput="maskPhone(this)">
    <p id="vfErr" class="hidden text-xs text-red-500 mt-2">Informe um e-mail válido e um telefone com DDD.</p>`,
    () => {
      const em = $('vfEmail').value.trim(), tel = $('vfTel').value.replace(/\D/g, '');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em) || tel.length < 10) { $('vfErr').classList.remove('hidden'); return false; }
      DB.verificado = true; save(); renderBanners(); toast('Conta verificada com sucesso!');
    }, { saveLabel: 'VERIFICAR' });
}

const TABS = [['KG', 'PERFIS/KG'], ['BARRA', 'PERFIS/BARRA'], ['ESP', 'PERFIS ESPECIAIS/BARRA'], ['COMP', 'COMPONENTES'], ['VID', 'VIDROS']];
const POR_PAG = 15;
let T = { tab: 'BARRA', q: '', linha: 'Todas', cat: 'Todas', acab: 'Todos', page: 1 };
const DATA_MAP = {};
function tabData(tab = T.tab) { return tab === 'KG' || tab === 'BARRA' ? PERFIS : tab === 'ESP' ? ESPECIAIS : tab === 'COMP' ? COMP_TAB : VID_TAB; }
function itemTab(tab, cod) {
  const key = (tab === 'KG' || tab === 'BARRA') ? 'P' : tab;
  if (!DATA_MAP[key]) DATA_MAP[key] = Object.fromEntries(tabData(tab).map(x => [x.cod, x]));
  return DATA_MAP[key][cod];
}
function unidadeTab(tab, item) { return tab === 'KG' ? 'KG' : tab === 'BARRA' || tab === 'ESP' ? 'BARRA' : tab === 'COMP' ? item.unit : 'M²'; }
function filtrados() {
  const q = T.q.trim().toLowerCase();
  return tabData().filter(x =>
    (!q || x.cod.toLowerCase().includes(q) || x.nome.toLowerCase().includes(q)) &&
    (T.linha === 'Todas' || x.linha === T.linha) &&
    (T.cat === 'Todas' || x.cat === T.cat) &&
    (T.acab === 'Todos' || x.acab === T.acab));
}
function pageList(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  if (cur <= 2) return [1, 2, 3, '…', total];
  if (cur >= total - 2) return [1, '…', total - 3, total - 2, total - 1, total];
  const pages = [1, cur - 1, cur, cur + 1, total].filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
  const out = [];
  pages.forEach((p, i) => { if (i > 0 && p - pages[i - 1] > 1) out.push('…'); out.push(p); });
  return out;
}

function tcSetAcab(k) { T.acab = k; T.page = 1; renderTcFiltros(); renderTcTable(); }
function renderTcTable() {

      </tr>`;

function lerTipForm() {

    acab: $('tp_acab').value, corComp: $('tp_corComp').value, arremate: $('tp_arremate').value, contramarco: $('tp_contramarco').value,

/* ---------- CUSTOS DE COMPRA ---------- */
function custosItens(o) {
  const m = materiaisObra(o);
  const items = [];
  if (m.perfis.length) {
    const linhas = Array.from(new Set(o.tipologias.map(t => t.params.linha))).join(', ');
    const acabs = Array.from(new Set(o.tipologias.map(t => t.params.acab))).join(', ');
    items.push({ key: 'PERFIL_KG', cod: 'PERFIS', d: `Perfis linha ${linhas} - ${acabs} (${m.perfis.length} perfis, ${fmt(m.kgObra, 3)}Kg)`, sug: 45.03, u: 'KG', g: 'Perfis' });
  }
  m.comps.forEach(c => items.push({ key: c.c, cod: c.c, d: c.d, sug: c.sug, u: c.u.toUpperCase(), g: 'Componentes' }));
  m.vidros.forEach(v => items.push({ key: v.c, cod: v.c, d: v.d, sug: v.sug, u: 'M²', g: 'Vidros' }));
  return items;
}
const preenchido = k => DB.custos[k] > 0;
function custosCompraHTML(o) {
  if (!o.tipologias.length) return vazio('Inclua tipologias na obra para listar os custos de compra.', `<button onclick="go('pesquisaTip',{obraId:'${o.id}'})" class="btn btn-blue">+ INCLUIR TIPOLOGIA</button>`);
  const items = custosItens(o);
  const ok = items.filter(i => preenchido(i.key)).length;
  const lista = custosFiltro === 'pendentes' ? items.filter(i => !preenchido(i.key)) : items;
  const grupo = g => {
    const todos = items.filter(i => i.g === g), vis = lista.filter(i => i.g === g);
    if (!todos.length) return '';
    return `<div class="bg-white rounded-lg shadow mb-4">
      <div class="px-4 py-3 border-b font-bold text-gray-700 flex justify-between"><span>${g}</span><span class="text-sm text-gray-500">${todos.filter(i => preenchido(i.key)).length}/${todos.length}</span></div>
      ${vis.length ? vis.map(i => {
        const f = preenchido(i.key);
        return `<div class="px-4 py-3 border-b last:border-0 flex flex-col md:flex-row md:items-center gap-2">
          <div class="flex-1 min-w-0"><div class="font-bold text-gray-800">${i.cod}</div><div class="text-xs text-gray-500">${esc(i.d)}</div></div>
          <div class="flex flex-wrap items-center gap-2 text-sm">
            <span class="text-gray-600">Sugerido: <b>${brl(i.sug)}/${i.u === 'KG' ? 'kg' : i.u}</b></span>
            <button onclick="usarSugerido('${o.id}','${i.key}',${i.sug})" class="btn btn-outline !py-1 !px-3">USAR</button>
            <button onclick="modalCustoMaterial('${o.id}','${i.key}')" class="btn text-white" style="background:${f ? '#2ECC71' : '#e74c3c'}">Meu custo ${brl(f ? DB.custos[i.key] : 0)}/${i.u}</button>
          </div>
        </div>`;
      }).join('') : `<div class="px-4 py-4 text-sm text-gray-500">Nenhum item pendente.</div>`}
    </div>`;
  };
  return `
  <div class="bg-white rounded-lg shadow p-4 mb-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
    <div><h2 class="text-lg font-bold text-gray-700">Custos de Compra <span class="text-[#00A99D]">${ok}/${items.length}</span></h2><p class="text-xs text-gray-500">Custos preenchidos / total de materiais da obra</p></div>
    <div class="flex flex-wrap gap-2">
      <div class="inline-flex rounded border overflow-hidden">
        <button onclick="setCustosFiltro('${o.id}','todos')" class="px-4 py-2 text-sm font-semibold ${custosFiltro === 'todos' ? 'bg-[#00A99D] text-white' : 'bg-white text-gray-600'}">Todos</button>
        <button onclick="setCustosFiltro('${o.id}','pendentes')" class="px-4 py-2 text-sm font-semibold ${custosFiltro === 'pendentes' ? 'bg-[#00A99D] text-white' : 'bg-white text-gray-600'}">Pendentes (${items.length - ok})</button>
      </div>
      <button onclick="usarTodosSugeridos('${o.id}')" class="btn btn-blue">USAR PREÇOS SUGERIDOS</button>
    </div>
  </div>
  ${grupo('Perfis')}${grupo('Componentes')}${grupo('Vidros')}
  <div class="flex flex-col sm:flex-row justify-end gap-2">
    <button onclick="go('orcamento',{id:'${o.id}',step:1})" class="btn btn-outline">IR PARA ORÇAMENTO</button>
    <button onclick="salvarCustosEIr('${o.id}')" class="btn btn-teal">SALVAR E IR PARA ORÇAMENTO</button>
  </div>`;
}
function rerenderCustos(oid) { const o = obraById(oid); o.valor = orcCalc(o).total; save(); $('custosBox').innerHTML = custosCompraHTML(o); }
function setCustosFiltro(oid, f) { custosFiltro = f; rerenderCustos(oid); }
function usarSugerido(oid, key, sug) { DB.custos[key] = sug; rerenderCustos(oid); toast('Custos carregados com sucesso!'); }
function usarTodosSugeridos(oid) {
  const items = custosItens(obraById(oid));
  const pend = items.filter(i => !preenchido(i.key));
  if (pend.length) { pend.forEach(i => DB.custos[i.key] = i.sug); rerenderCustos(oid); toast('Custos carregados com sucesso!'); return; }
  openModal('Usar preços sugeridos', '<p class="text-sm">Todos os custos já estão preenchidos. Deseja substituir todos os seus custos pelos preços sugeridos?</p>', () => {
    items.forEach(i => DB.custos[i.key] = i.sug); rerenderCustos(oid); toast('Custos carregados com sucesso!');
  }, { saveLabel: 'SUBSTITUIR' });
}
function modalCustoMaterial(oid, key) {
  const it = custosItens(obraById(oid)).find(i => i.key === key);
  openModal('Alterar Custo Material', `
    <p class="text-sm font-bold text-gray-700">${it.cod}</p><p class="text-xs text-gray-500">${esc(it.d)}</p>
    <p class="text-xs text-gray-500 mt-2">Preço sugerido: ${brl(it.sug)}/${it.u}</p>
    <label class="lbl">Meu custo (R$/${it.u})</label>
    <input id="mcmVal" type="number" min="0" step="0.01" class="inp" value="${DB.custos[key] || ''}" placeholder="0,00">
    <p id="mcmErr" class="hidden text-xs text-red-500 mt-1">Informe um valor maior que zero.</p>`,
    () => {
      const v = num($('mcmVal').value);
      if (!(v > 0)) { $('mcmErr').classList.remove('hidden'); $('mcmVal').classList.add('err'); return false; }
      DB.custos[key] = r2(v) === v ? v : Math.round(v * 1000) / 1000;
      rerenderCustos(oid);
      toast('Custos carregados com sucesso!');
    });
}
function salvarCustosEIr(oid) { const o = obraById(oid); o.valor = orcCalc(o).total; save(); toast('Custos salvos com sucesso!'); go('orcamento', { id: oid, step: 1 }); }

VIEWS.orcamento = p => {
  const o = obraById(p.id);

function gerarLote() {
  const ids = Array.from(document.querySelectorAll('.lote-chk:checked')).map(x => x.value);
  if (!ids.length) { toast('Selecione ao menos uma obra.', 'erro'); return; }
  const P = {}, C = {};
  let kg = 0, kgC = 0;
  ids.forEach(id => {
    const m = materiaisObra(obraById(id));
    m.perfis.forEach(x => { const a = P[x.cod] || (P[x.cod] = { cod: x.cod, d: x.d, kg: 0, barras: 0 }); a.kg += x.kgObra; a.barras += x.barras; });
    m.comps.forEach(x => { const a = C[x.c] || (C[x.c] = { c: x.c, d: x.d, u: x.u, qtd: 0 }); a.qtd += x.qtd; });
    kg += m.kgObra; kgC += m.kgCompra;
  });
  $('loteRes').innerHTML = `<div class="bg-white rounded-lg shadow p-4">
    <h3 class="font-bold text-gray-700 mb-2">Plano consolidado (${ids.length} obra(s)) · ${fmt(kg, 3)} Kg líquido · ${fmt(kgC, 3)} Kg bruto</h3>
    <div class="overflow-x-auto border rounded"><table class="tbl w-full text-sm min-w-[480px]"><thead><tr><th>Perfil</th><th>Descrição</th><th class="text-right">Barras</th><th class="text-right">Kg</th></tr></thead>
    <tbody>${Object.values(P).map(x => `<tr><td class="font-bold">${x.cod}</td><td>${x.d}</td><td class="text-right">${x.barras}</td><td class="text-right">${fmt(x.kg, 3)}</td></tr>`).join('')}</tbody></table></div>
    <div class="overflow-x-auto border rounded mt-4"><table class="tbl w-full text-sm min-w-[480px]"><thead><tr><th>Componente</th><th>Descrição</th><th class="text-right">Qtd</th><th>Un.</th></tr></thead>
    <tbody>${Object.values(C).map(x => `<tr><td class="font-bold">${x.c}</td><td>${x.d}</td><td class="text-right">${fmt(x.qtd, Number.isInteger(x.qtd) ? 0 : 2)}</td><td>${x.u}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
  toast('Plano de produção gerado!');
}

const TIPS = [
  { id: 'jc200', cod: 'JC200', nome: 'Janela de Correr 2 Folhas', cat: 'Janela', m2: 2.2, perfis: ['MG25-016', 'MG25-118', 'MG25-101'], comps: COMPS.map(c => c.c), vid: 'VID-002' }
];
const TIP_BY = Object.fromEntries(TIPS.map(t => [t.id, t]));

function calcTipologia(tip, params) {
  const r = mulberry32(params.seed || 1);
  const w = params.w || 2000, h = params.h || 1500;
  const m2Total = (w * h) / 1e6;
  const kgObra = r2((w * 2 + h * 2) / 1000 * 0.8 + r() * 0.5);
  const kgCompra = r2(kgObra * 1.15);
  const perfis = (tip.perfis || []).map(cod => {
    const p = PERFIS.find(x => x.cod === cod) || PERFIS[0];
    return { cod, d: p.nome, kgObra: kgObra / tip.perfis.length, kgCompra: kgCompra / tip.perfis.length, barras: 1, qtd: 2 };
  });
  const comps = COMPS.map(c => ({ c: c.c, d: c.d, u: c.u, emb: c.emb, sug: c.sug, qtd: c.q * (m2Total || 1) }));
  const vidros = [{ c: tip.vid || 'VID-002', d: 'Vidro', w, h, m2: m2Total, kg: m2Total * 10, qtd: 1, sug: 110 }];
  return { m2Total, kgObra, kgCompra, perfis, comps, vidros };
}

/* =========================================================
   MATERIAIS E ORÇAMENTO DA OBRA
   ========================================================= */
function materiaisObra(obra) {
  const P = {}, C = {}, V = {};
  let m2Esq = 0, pecas = 0;
  const pk = preco('PERFIL_KG', 45.03);
  const custoTip = [];
  obra.tipologias.forEach(t => {
    const tip = TIP_BY[t.tip];
    const res = calcTipologia(tip, t.params);
    const q = num(t.qtd) || 1;
    pecas += q;
    m2Esq += res.m2Total * q;
    let ct = res.kgObra * pk;
    res.perfis.forEach(x => {
      const a = P[x.cod] || (P[x.cod] = { cod: x.cod, d: x.d, kgObra: 0, kgCompra: 0, barras: 0, qtd: 0 });
      a.kgObra += x.kgObra * q; a.kgCompra += x.kgCompra * q; a.barras += x.barras * q; a.qtd += x.qtd * q;
    });
    res.comps.forEach(x => {
      const a = C[x.c] || (C[x.c] = { c: x.c, d: x.d, u: x.u, emb: x.emb, sug: x.sug, qtd: 0 });
      a.qtd += x.qtd * q;
      ct += x.qtd * q * preco(x.c, x.sug);
    });
    res.vidros.forEach(x => {
      const a = V[x.c] || (V[x.c] = { c: x.c, d: x.d, sug: x.sug, m2: 0, kg: 0, pcs: 0 });
      a.m2 += x.m2 * q; a.kg += x.kg * q; a.pcs += x.qtd * q;
      ct += x.m2 * q * preco(x.c, x.sug);
    });
    custoTip.push(ct);
  });
  const perfis = Object.values(P);
  const kgObra = r3(perfis.reduce((s, x) => s + x.kgObra, 0));
  const kgCompra = r3(perfis.reduce((s, x) => s + x.kgCompra, 0));
  const comps = Object.values(C).map(a => {
    a.qtd = r3(a.qtd);
    a.compraQtd = Math.ceil(a.qtd / a.emb - 1e-9) * a.emb;
    a.preco = preco(a.c, a.sug);
    a.vObra = a.qtd * a.preco;
    a.vCompra = a.compraQtd * a.preco;
    return a;
  });
  const vidros = Object.values(V).map(a => { a.preco = preco(a.c, a.sug); a.valor = r2(a.m2 * a.preco); return a; });
  const m2Vidro = vidros.reduce((s, x) => s + x.m2, 0);
  return {
    perfis, comps, vidros, kgObra, kgCompra, m2Esq, m2Vidro, pecas, custoTip, precoKg: pk,
    perfisObra: r2(kgObra * pk), perfisCompra: r2(kgCompra * pk),
    compsObra: r2(comps.reduce((s, x) => s + x.vObra, 0)), compsCompra: r2(comps.reduce((s, x) => s + x.vCompra, 0)),
    vidrosTotal: r2(vidros.reduce((s, x) => s + x.valor, 0))
  };
}
function orcCalc(obra) {
  const m = materiaisObra(obra);
  const o = obra.orc;
  const perf = o.modoPerfis === 'compra' ? m.perfisCompra : m.perfisObra;
  const comp = o.modoComps === 'compra' ? m.compsCompra : m.compsObra;
  const mat = r2(perf + comp + m.vidrosTotal);
  const prod = r2((o.prodModo === 'bruto' ? m.kgCompra : m.kgObra) * num(o.custoKg));
  const instBase = o.instModo === 'KG' ? m.kgObra : o.instModo === 'M2' ? m.m2Esq : m.pecas;
  const inst = r2(instBase * num(o.custoInst));
  const custo = r2(mat + prod + inst);
  const lucro = r2(custo * num(o.margem) / 100);
  const imp = Math.min(Math.max(num(o.impostos), 0), 95);
  const bruto = r2(custo + lucro);
  const impostos = r2(bruto / (1 - imp / 100) - bruto);
  const precoFinal = r2(bruto + impostos);
  const somaCt = m.custoTip.reduce((s, x) => s + x, 0);
  let acum = 0;
  const itens = obra.tipologias.map((t, i) => {
    let v;
    if (i === obra.tipologias.length - 1) v = r2(precoFinal - acum);
    else { v = r2(somaCt > 0 ? precoFinal * m.custoTip[i] / somaCt : precoFinal / obra.tipologias.length); acum = r2(acum + v); }
    const desc = t.desconto || 0;
    return { tip: TIP_BY[t.tip], qtd: t.qtd, valor: v, desconto: desc, subtotal: r2(v * (1 - desc / 100)) };
  });
  const total = r2(itens.reduce((s, x) => s + x.subtotal, 0));
  return { mat, prod, inst, custo, lucro, impostos, preco: precoFinal, total, itens, matObra: r2(m.perfisObra + m.compsObra + m.vidrosTotal), matCompra: r2(m.perfisCompra + m.compsCompra + m.vidrosTotal) };
}

function custosItens(o) {
  const m = materiaisObra(o);
  const items = [];
  if (m.perfis.length) {
    const linhas = Array.from(new Set(o.tipologias.map(t => t.params.linha))).join(', ');
    const acabs = Array.from(new Set(o.tipologias.map(t => t.params.acab))).join(', ');
    items.push({ key: 'PERFIL_KG', cod: 'PERFIS', d: `Perfis linha ${linhas} - ${acabs} (${m.perfis.length} perfis, ${fmt(m.kgObra, 3)}Kg)`, sug: 45.03, u: 'KG', g: 'Perfis' });
  }
  m.comps.forEach(c => items.push({ key: c.c, cod: c.c, d: c.d, sug: c.sug, u: c.u.toUpperCase(), g: 'Componentes' }));
  m.vidros.forEach(v => items.push({ key: v.c, cod: v.c, d: v.d, sug: v.sug, u: 'M²', g: 'Vidros' }));
  return items;
}

AFTER.orcamento = p => { if ((p.step || 1) === 2 && $('o2Kg')) upd2(p.id, true); if ((p.step || 1) === 6 && $('print-area')) salvarOrcamento(p.id); };
function upd2(oid, silencioso) {
  const o = obraById(oid), r = o.orc;
  r.prodModo = document.querySelector('input[name=prodModo]:checked').value;
  r.custoKg = num($('o2Kg').value);
  r.instModo = $('o2InstModo').value;
  r.custoInst = $('o2Inst').value === '' ? '' : num($('o2Inst').value);
  r.margem = num($('o2Margem').value);
  r.impostos = Math.min(num($('o2Imp').value), 95);
  const c = orcCalc(o);
  o.valor = c.total; save();
  $('s2ProdLbl').textContent = r.prodModo === 'bruto' ? 'Bruto' : 'Líquido';
  $('s2ProdBase').textContent = fmt(r.prodModo === 'bruto' ? c.kgCompra : c.kgObra, 3);
  $('s2Prod').textContent = brl(c.prod);
  $('s2InstLbl').textContent = { 'PEÇA': 'Custo Peça', 'KG': 'Custo Kg', 'M2': 'Custo M²' }[r.instModo];
  $('s2InstBase').textContent = r.instModo === 'PEÇA' ? c.pecas + ' peça(s)' : r.instModo === 'KG' ? fmt(c.kgObra, 3) + ' Kg' : fmt(c.m2Esq, 3) + ' m²';
  $('s2Inst').textContent = brl(c.inst);
  $('s2Custo').textContent = brl(c.custo);
  $('s2MargemPct').textContent = fmt(r.margem, 0);
  $('s2ImpPct').textContent = fmt(r.impostos, 0);
  $('s2Lucro').textContent = brl(c.lucro);
  $('s2Imp').textContent = brl(c.impostos);
  $('s2LI').textContent = brl(c.lucroImp);
  $('s2Preco').textContent = brl(c.preco);
  if (!silencioso) validarEtapa2(true);
}
function validarEtapa2(soVisual) {
  const el = $('o2Inst');
  if (!el) return true;
  const ok = el.value !== '' && num(el.value) >= 0;
  el.classList.toggle('err', !ok);
  $('o2InstErr').classList.toggle('hidden', ok);
  if (!ok && !soVisual) toast('Informe o custo de instalação (campo obrigatório).', 'erro');
  return ok;
}

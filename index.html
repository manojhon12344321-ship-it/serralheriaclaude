const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hoje() { return new Date(); }
function dataBR(iso) { if (!iso) return 'a Combinar'; const p = String(iso).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }

function maskPhone(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  let o = '';
  if (d.length) o = '(' + d.slice(0, 2);
  if (d.length >= 3) {
    o += ')';
    const rest = d.slice(2);
    const cut = rest.length > 8 ? 5 : 4;
    o += rest.length > cut ? rest.slice(0, cut) + '-' + rest.slice(cut) : rest;
  }
  el.value = o;
}

function sortearAcab(r) {
  const x = r();
  if (x < 0.45) return 'BR';
  if (x < 0.60) return 'BF';
  if (x < 0.74) return 'PT';
  if (x < 0.86) return 'BZ';

}

/* ---------- 2145 PERFIS (11 linhas x 195 perfis) ---------- */
let PERFIS = (function () {
  const r = mulberry32(20262145);
  const out = [];
  LINHAS.forEach(([linha, pref], li) => {
    let n = 0;
    for (let k = 0; k < 195; k++) {
      n += (linha === 'MG25') ? 1 : 1 + (r() < 0.25 ? Math.floor(r() * 4) : 0);
      const cod = pref + '-' + String(n).padStart(3, '0');
      const nm = NOMES_PERFIS[(k * 7 + li * 5 + Math.floor(r() * 3)) % NOMES_PERFIS.length];
      const kgBarra = r2(0.5 + r() * 4.5);
      const barLen = r() < 0.8 ? 6000 : 5800;
      out.push({ cod, nome: nm[0], cat: nm[1], linha, acab: sortearAcab(r), kgBarra, kgm: r2(kgBarra / (barLen / 1000)), barLen, seed: li * 1000 + k + 1, sug: 45.03, unit: 'KG' });
    }
  });
  const over = {
    'MG25-016': { nome: 'Marco inferior 2 planos', cat: 'Marcos', kgm: 0.78, kgBarra: 4.72, acab: 'BR', barLen: 6000 },
    'MG25-118': { nome: 'Marco superior 2 planos', cat: 'Marcos', kgm: 0.62, kgBarra: 3.72, acab: 'BR', barLen: 6000 },

  };
  const first = [];
  ['MG25-016', 'MG25-118', 'MG25-101'].forEach(c => {
    const i = out.findIndex(p => p.cod === c);
    Object.assign(out[i], over[c]);
    first.push(out.splice(i, 1)[0]);
  });
  return first.concat(out);
})();

const R2_URL_TABELA_CUSTO = 'https://pub-809552f3b06e437abec2dd924c2a9407.r2.dev/.gz';
window.PERFIS_R2 = null;
async function carregarTabelaCustoDoR2(){
  if(window.PERFIS_R2 && window.PERFIS_R2.length) return window.PERFIS_R2;
  try{
    var aviso=document.getElementById('tcBody');
    if(aviso) aviso.innerHTML='<tr><td colspan="7" style="padding:24px;text-align:center">⏳ Baixando perfis do R2 (44MB .gz)...</td></tr>';
    var resp=await fetch(R2_URL_TABELA_CUSTO);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var buf=await resp.arrayBuffer();
    var ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    var txt=await new Response(ds).text();
    var dados=JSON.parse(txt);
    if(!Array.isArray(dados)) dados=dados.perfis||dados.data||dados.items||Object.values(dados);
    function mapear(it,i){
      var cod=String(it.cod||it.codigo||it.code||it.id||('PERFIL-'+(i+1))).trim();
      var nome=String(it.nome||it.name||it.descricao||it.desc||('Perfil '+cod)).trim();
      var cat=it.cat||it.categoria||'Perfis';
      var linha=it.linha||'MG25';
      var acab=String(it.acab||'BR').substring(0,2).toUpperCase();
      var kgBarra=Number(it.kgBarra||it.peso||2.5);
      var kgm=Number(it.kgm||0.5);
      return {cod:cod,nome:nome,cat:cat,linha:linha,acab:acab,kgBarra:isFinite(kgBarra)?kgBarra:2.5,kgm:isFinite(kgm)?kgm:0.5,barLen:6000,seed:i,sug:45.03,unit:'KG'};
    }
    var lista=[];
    for(var i=0;i<dados.length;i++) lista.push(mapear(dados[i],i));
    window.PERFIS_R2=lista;
    try{ Object.keys(DATA_MAP).forEach(function(k){ delete DATA_MAP[k]; }); }catch(e){}
    if(typeof renderTcTable==='function') renderTcTable();
    if(typeof renderTcFiltros==='function') renderTcFiltros();
    if(typeof renderTcTabs==='function') renderTcTabs();
    return lista;
  }catch(e){
    console.error('Erro R2',e);
    var aviso2=document.getElementById('tcBody');
    if(aviso2) aviso2.innerHTML='<tr><td colspan="7" style="padding:24px;text-align:center;color:#e74c3c">Erro R2: '+e.message+' - Usando dados locais</td></tr>';
    if(typeof renderTcTable==='function') renderTcTable();
    return null;
  }
}

function alterarQtdTip(oid, i, d) {
  const o = obraById(oid);
  o.tipologias[i].qtd = Math.max(1, (num(o.tipologias[i].qtd) || 1) + d);
  o.valor = orcCalc(o).total; save(); render();
}
function removerTip(oid, i) {
  const o = obraById(oid);
  openModal('Remover tipologia', `<p class="text-sm">Deseja remover a tipologia <b>${o.tipologias[i].tip}</b> desta obra?</p>`, () => {
    o.tipologias.splice(i, 1); o.valor = o.tipologias.length ? orcCalc(o).total : 0; save(); render(); toast('Tipologia removida.');
  }, { saveLabel: 'REMOVER' });
}
function verListaTip(oid, i) {
  const o = obraById(oid), t = o.tipologias[i];
  openModal('Lista Técnica - ' + t.tip, listaHTML(calcTipologia(TIP_BY[t.tip], t.params)), null, { wide: true });
}

/* ---------- PESQUISA TIPOLOGIA ---------- */
let PT = { chips: [], q: '' };

  <button onclick="go('obra',{id:'${o.id}'})" class="text-sm text-[#00A99D] font-semibold mb-2 hover:underline">← Obra Nº ${o.numero}</button>

};
AFTER.pesquisaTip = p => renderPT(p.obraId);
function togglePTChip(i, oid) {
  const ch = CHIPS[i];
  PT.chips = PT.chips.includes(ch) ? PT.chips.filter(x => x !== ch) : [...PT.chips, ch];
  renderPT(oid);
}
function renderPT(oid) {
  $('ptChips').innerHTML = CHIPS.map((c, i) => `<span onclick="togglePTChip(${i},'${oid}')" class="chip ${PT.chips.includes(c) ? 'on' : ''}">${c}</span>`).join('') +
    (PT.chips.length ? `<span onclick="PT.chips=[];renderPT('${oid}')" class="text-xs text-gray-500 underline cursor-pointer self-center ml-1">limpar</span>` : '');
  const q = PT.q.trim().toLowerCase();
  const lista = TIPOLOGIAS.filter(t => PT.chips.every(c => t.tags.includes(c)) && (!q || t.cod.toLowerCase().includes(q) || t.nome.toLowerCase().includes(q) || t.linha.toLowerCase().includes(q)));
  $('ptList').innerHTML = lista.length ? lista.map(t => `
    <div onclick="go('tipDetalhe',{obraId:'${oid}',cod:'${t.cod}'})" class="bg-white rounded-lg shadow p-4 cursor-pointer hover:ring-2 hover:ring-[#00A99D] flex gap-3 items-center">
      <div class="shrink-0">${janelaSVG(t, 96, 69)}</div>
      <div class="min-w-0"><div class="font-extrabold text-gray-800">${t.cod}</div><div class="text-sm text-gray-600">${t.nome}</div><div class="text-xs text-gray-400 mt-1">Linha ${t.linha}</div>
      <div class="flex flex-wrap gap-1 mt-2">${t.tags.map(g => `<span class="text-[10px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">${g}</span>`).join('')}</div></div>
    </div>`).join('') : `<div class="col-span-full bg-white rounded-lg shadow p-8 text-center text-gray-500">Nenhuma tipologia encontrada.</div>`;
}

/* ---------- DETALHE TIPOLOGIA ---------- */
function selHTML(id, label, opcoes, val) {
  return `<div><label class="lbl">${label}</label><select id="${id}" class="inp">${opcoes.map(x => `<option ${String(x) === String(val) ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`;
}
function numHTML(id, label, val, min, max) {
  return `<div><label class="lbl">${label} <span class="text-gray-400 font-normal">MIN ${min} MAX ${max}</span></label>
    <input id="${id}" type="number" class="inp" value="${val}" data-min="${min}" data-max="${max}" oninput="validarNum(this)">
    <p id="${id}_err" class="hidden text-xs text-red-500 mt-1">Valor deve estar entre ${min} e ${max}.</p></div>`;
}
function validarNum(el) {
  const v = el.value === '' ? NaN : num(el.value), mi = num(el.dataset.min), ma = num(el.dataset.max);
  const ok = !isNaN(v) && v >= mi && v <= ma;
  el.classList.toggle('err', !ok);
  $(el.id + '_err').classList.toggle('hidden', ok);
  return ok;
}

    <div class="lg:col-span-2 space-y-4">
      <div class="bg-white rounded-lg shadow p-4">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">

          ${selHTML('tp_acab', 'Acabamento', ACABS.map(a => a.n), v.acab)}
          ${selHTML('tp_corComp', 'Cor Componente', ['Branco', 'Preto', 'Bronze'], v.corComp)}
          ${selHTML('tp_arremate', 'Arremate', Object.keys(ARREMATES), v.arremate)}
          ${selHTML('tp_contramarco', 'Contramarco', Object.keys(CONTRAMARCOS), v.contramarco)}

        <h3 class="font-bold text-[#00A99D] border-b pb-2">VIDROS</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
          ${selHTML('tp_vidroTipo', 'Tipo', Object.keys(VIDRO_PREF), v.vidroTipo)}
          ${selHTML('tp_vidroEsp', 'Espessura', ['6mm', '4mm'], v.vidroEsp)}
        </div>
      </div>
      <div class="flex justify-end"><button onclick="gerarLista('${o.id}','${tip.cod}',${edit ? p.idx : -1})" class="btn btn-blue">GERAR LISTA DE MATERIAIS</button></div>
      <div id="listaTec"></div>
    </div>
  </div>`;
};
function lerTipForm() {
  return {
    linha: $('tp_linha').value, mao: $('tp_mao').value, L: num($('tp_L').value), H: num($('tp_H').value),
    acab: $('tp_acab').value, corComp: $('tp_corComp').value, arremate: $('tp_arremate').value, contramarco: $('tp_contramarco').value,
    folga: num($('tp_folga').value), fecho: $('tp_fecho').value, vidroTipo: $('tp_vidroTipo').value, vidroEsp: $('tp_vidroEsp').value
  };
}
function tipFormValido() {
  const a = validarNum($('tp_L')), b = validarNum($('tp_H')), c = validarNum($('tp_folga'));
  if (!(a && b && c)) { toast('Corrija os campos fora dos limites MIN/MAX.', 'erro'); return false; }
  return true;
}
function gerarLista(oid, cod, idx) {
  if (!tipFormValido()) return;
  const res = calcTipologia(TIP_BY[cod], lerTipForm());
  $('listaTec').innerHTML = `<div class="bg-white rounded-lg shadow p-4">
    <h3 class="font-bold text-gray-700 text-lg mb-3">Lista Técnica</h3>${listaHTML(res)}
    <div class="flex justify-end mt-4"><button onclick="salvarTipologia('${oid}','${cod}',${idx})" class="btn btn-green">SALVAR TIPOLOGIA</button></div></div>`;
  $('listaTec').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function salvarTipologia(oid, cod, idx) {
  if (!tipFormValido()) return;
  const o = obraById(oid);
  const params = lerTipForm();
  if (idx >= 0 && o.tipologias[idx]) o.tipologias[idx].params = params;
  else o.tipologias.push({ tip: cod, params, qtd: 1, desconto: 0 });
  o.valor = orcCalc(o).total;
  save();
  toast('Tipologia salva com sucesso!');
  go('obra', { id: oid });
}

    <tfoot><tr class="bg-gray-50 font-bold"><td colspan="4">Total Kg (obra) · Necessidade de compra: ${fmt(r3(res.kgCompra), 3)} Kg</td><td class="text-right">${res.perfis.reduce((s, x) => s + x.barras, 0)}</td><td class="text-right">${fmt(r3(res.kgObra), 3)}</td></tr></tfoot>

    <tbody>${res.vidros.map(x => `<tr><td class="font-semibold">${x.c}</td><td>${x.d}</td><td class="text-right">${x.qtd}</td><td class="text-right">${x.w}x${x.h}</td><td class="text-right">${fmt(x.m2, 3)}</td><td class="text-right">${fmt(x.kg, 3)}</td></tr>`).join('')}</tbody>

/* ---------- CUSTOS DE COMPRA ---------- */
function custosItens(o) {
  const m = materiaisObra(o);
  const items = [];
  if (m.perfis.length) {
    const linhas = Array.from(new Set(o.tipologias.map(t => t.params.linha))).join(', ');
    const acabs = Array.from(new Set(o.tipologias.map(t => t.params.acab))).join(', ');
    items.push({ key: 'PERFIL_KG', cod: 'PERFIS', d: `Perfis linha ${linhas} - ${acabs} (${m.perfis.length} perfis, ${fmt(m.kgObra, 3)}Kg)`, sug: 45.03, u: 'KG', g: 'Perfis' });
  }
  m.comps.forEach(c => items.push({ key: c.c, cod: c.c, d: c.d, sug: c.sug, u: c.u.toUpperCase(), g: 'Componentes' }));
  m.vidros.forEach(v => items.push({ key: v.c, cod: v.c, d: v.d, sug: v.sug, u: 'M²', g: 'Vidros' }));
  return items;
}
const preenchido = k => DB.custos[k] > 0;
function custosCompraHTML(o) {
  if (!o.tipologias.length) return vazio('Inclua tipologias na obra para listar os custos de compra.', `<button onclick="go('pesquisaTip',{obraId:'${o.id}'})" class="btn btn-blue">+ INCLUIR TIPOLOGIA</button>`);
  const items = custosItens(o);
  const ok = items.filter(i => preenchido(i.key)).length;
  const lista = custosFiltro === 'pendentes' ? items.filter(i => !preenchido(i.key)) : items;
  const grupo = g => {
    const todos = items.filter(i => i.g === g), vis = lista.filter(i => i.g === g);
    if (!todos.length) return '';
    return `<div class="bg-white rounded-lg shadow mb-4">
      <div class="px-4 py-3 border-b font-bold text-gray-700 flex justify-between"><span>${g}</span><span class="text-sm text-gray-500">${todos.filter(i => preenchido(i.key)).length}/${todos.length}</span></div>
      ${vis.length ? vis.map(i => {
        const f = preenchido(i.key);
        return `<div class="px-4 py-3 border-b last:border-0 flex flex-col md:flex-row md:items-center gap-2">
          <div class="flex-1 min-w-0"><div class="font-bold text-gray-800">${i.cod}</div><div class="text-xs text-gray-500">${esc(i.d)}</div></div>
          <div class="flex flex-wrap items-center gap-2 text-sm">
            <span class="text-gray-600">Sugerido: <b>${brl(i.sug)}/${i.u === 'KG' ? 'kg' : i.u}</b></span>
            <button onclick="usarSugerido('${o.id}','${i.key}',${i.sug})" class="btn btn-outline !py-1 !px-3">USAR</button>
            <button onclick="modalCustoMaterial('${o.id}','${i.key}')" class="btn text-white" style="background:${f ? '#2ECC71' : '#e74c3c'}">Meu custo ${brl(f ? DB.custos[i.key] : 0)}/${i.u}</button>
          </div>
        </div>`;
      }).join('') : `<div class="px-4 py-4 text-sm text-gray-500">Nenhum item pendente.</div>`}
    </div>`;
  };
  return `
  <div class="bg-white rounded-lg shadow p-4 mb-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
    <div><h2 class="text-lg font-bold text-gray-700">Custos de Compra <span class="text-[#00A99D]">${ok}/${items.length}</span></h2><p class="text-xs text-gray-500">Custos preenchidos / total de materiais da obra</p></div>
    <div class="flex flex-wrap gap-2">
      <div class="inline-flex rounded border overflow-hidden">
        <button onclick="setCustosFiltro('${o.id}','todos')" class="px-4 py-2 text-sm font-semibold ${custosFiltro === 'todos' ? 'bg-[#00A99D] text-white' : 'bg-white text-gray-600'}">Todos</button>
        <button onclick="setCustosFiltro('${o.id}','pendentes')" class="px-4 py-2 text-sm font-semibold ${custosFiltro === 'pendentes' ? 'bg-[#00A99D] text-white' : 'bg-white text-gray-600'}">Pendentes (${items.length - ok})</button>
      </div>
      <button onclick="usarTodosSugeridos('${o.id}')" class="btn btn-blue">USAR PREÇOS SUGERIDOS</button>
    </div>
  </div>
  ${grupo('Perfis')}${grupo('Componentes')}${grupo('Vidros')}
  <div class="flex flex-col sm:flex-row justify-end gap-2">
    <button onclick="go('orcamento',{id:'${o.id}',step:1})" class="btn btn-outline">IR PARA ORÇAMENTO</button>
    <button onclick="salvarCustosEIr('${o.id}')" class="btn btn-teal">SALVAR E IR PARA ORÇAMENTO</button>
  </div>`;
}
function rerenderCustos(oid) { const o = obraById(oid); o.valor = orcCalc(o).total; save(); $('custosBox').innerHTML = custosCompraHTML(o); }
function setCustosFiltro(oid, f) { custosFiltro = f; rerenderCustos(oid); }
function usarSugerido(oid, key, sug) { DB.custos[key] = sug; rerenderCustos(oid); toast('Custos carregados com sucesso!'); }
function usarTodosSugeridos(oid) {
  const items = custosItens(obraById(oid));
  const pend = items.filter(i => !preenchido(i.key));
  if (pend.length) { pend.forEach(i => DB.custos[i.key] = i.sug); rerenderCustos(oid); toast('Custos carregados com sucesso!'); return; }
  openModal('Usar preços sugeridos', '<p class="text-sm">Todos os custos já estão preenchidos. Deseja substituir todos os seus custos pelos preços sugeridos?</p>', () => {
    items.forEach(i => DB.custos[i.key] = i.sug); rerenderCustos(oid); toast('Custos carregados com sucesso!');
  }, { saveLabel: 'SUBSTITUIR' });
}
function modalCustoMaterial(oid, key) {
  const it = custosItens(obraById(oid)).find(i => i.key === key);
  openModal('Alterar Custo Material', `
    <p class="text-sm font-bold text-gray-700">${it.cod}</p><p class="text-xs text-gray-500">${esc(it.d)}</p>
    <p class="text-xs text-gray-500 mt-2">Preço sugerido: ${brl(it.sug)}/${it.u}</p>
    <label class="lbl">Meu custo (R$/${it.u})</label>
    <input id="mcmVal" type="number" min="0" step="0.01" class="inp" value="${DB.custos[key] || ''}" placeholder="0,00">
    <p id="mcmErr" class="hidden text-xs text-red-500 mt-1">Informe um valor maior que zero.</p>`,
    () => {
      const v = num($('mcmVal').value);
      if (!(v > 0)) { $('mcmErr').classList.remove('hidden'); $('mcmVal').classList.add('err'); return false; }
      DB.custos[key] = r2(v) === v ? v : Math.round(v * 1000) / 1000;
      rerenderCustos(oid);
      toast('Custos carregados com sucesso!');
    });
}
function salvarCustosEIr(oid) { const o = obraById(oid); o.valor = orcCalc(o).total; save(); toast('Custos salvos com sucesso!'); go('orcamento', { id: oid, step: 1 }); }

/* =========================================================
   ORÇAMENTO (6 ETAPAS)
   ========================================================= */
const ETAPAS = ['Custos Materiais', 'Produção e Instalação', 'Ajuste de Preços', 'Entrega e Pagamento', 'Informações Principais', 'Resumo'];
VIEWS.orcamento = p => {
  const o = obraById(p.id);
  const step = p.step || 1;
  if (!o.tipologias.length) return `<button onclick="go('obra',{id:'${o.id}'})" class="text-sm text-[#00A99D] font-semibold mb-2 hover:underline">← Obra Nº ${o.numero}</button>` +
    vazio('Esta obra ainda não possui tipologias. Inclua ao menos uma tipologia para gerar o orçamento.', `<button onclick="go('pesquisaTip',{obraId:'${o.id}'})" class="btn btn-blue">+ INCLUIR TIPOLOGIA</button>`);
  const c = orcCalc(o);
  const corpo = [null, orcStep1, orcStep2, orcStep3, orcStep4, orcStep5, orcStep6][step](o, c);
  return `
  <button onclick="go('obra',{id:'${o.id}'})" class="text-sm text-[#00A99D] font-semibold mb-2 hover:underline no-print">← Obra Nº ${o.numero}</button>
  ${pageHeader('Orçamento - Obra Nº ' + o.numero, 'Etapa ' + step + ' de 6 · ' + ETAPAS[step - 1])}
  <div class="bg-white rounded-lg shadow p-3 mb-4 overflow-x-auto no-print">
    <div class="flex items-center min-w-[640px]">
      ${ETAPAS.map((e, i) => `
        <div onclick="irEtapa('${o.id}',${i + 1})" class="flex items-center gap-2 cursor-pointer ${i < 5 ? 'flex-1' : ''}">

function upd2(oid, silencioso) {
  const o = obraById(oid), r = o.orc;
  r.prodModo = document.querySelector('input[name=prodModo]:checked').value;
  r.custoKg = num($('o2Kg').value);
  r.instModo = $('o2InstModo').value;
  r.custoInst = $('o2Inst').value === '' ? '' : num($('o2Inst').value);
  r.margem = num($('o2Margem').value);
  r.impostos = Math.min(num($('o2Imp').value), 95);
  const c = orcCalc(o);
  o.valor = c.total; save();
  $('s2ProdLbl').textContent = r.prodModo === 'bruto' ? 'Bruto' : 'Líquido';
  $('s2ProdBase').textContent = fmt(r.prodModo === 'bruto' ? c.kgCompra : c.kgObra, 3);
  $('s2Prod').textContent = brl(c.prod);
  $('s2InstLbl').textContent = { 'PEÇA': 'Custo Peça', 'KG': 'Custo Kg', 'M2': 'Custo M²' }[r.instModo];
  $('s2InstBase').textContent = r.instModo === 'PEÇA' ? c.pecas + ' peça(s)' : r.instModo === 'KG' ? fmt(c.kgObra, 3) + ' Kg' : fmt(c.m2Esq, 3) + ' m²';
  $('s2Inst').textContent = brl(c.inst);
  $('s2Custo').textContent = brl(c.custo);
  $('s2MargemPct').textContent = fmt(r.margem, 0);
  $('s2ImpPct').textContent = fmt(r.impostos, 0);
  $('s2Lucro').textContent = brl(c.lucro);
  $('s2Imp').textContent = brl(c.impostos);
  $('s2LI').textContent = brl(c.lucroImp);
  $('s2Preco').textContent = brl(c.preco);
  if (!silencioso) validarEtapa2(true);
}
function validarEtapa2(soVisual) {
  const el = $('o2Inst');

  const ok = el.value !== '' && num(el.value) >= 0;
  el.classList.toggle('err', !ok);

}

function modalDesconto(oid) {
  const o = obraById(oid), c = orcCalc(o);
  openModal('Adicionar Desconto', `
    <label class="lbl !mt-0">Tipologia</label>
    <select id="mdTip" class="inp">${c.itens.map(i => `<option value="${i.idx}">${i.tip.cod} - ${brl(i.valor)}</option>`).join('')}</select>
    <label class="lbl">Tipo de desconto</label>
    <select id="mdTipo" class="inp"><option value="R$">Valor (R$)</option><option value="%">Percentual (%)</option></select>
    <label class="lbl">Desconto</label>
    <input id="mdVal" type="number" min="0" step="0.01" class="inp" placeholder="0,00">
    <p id="mdErr" class="hidden text-xs text-red-500 mt-1">Desconto inválido: deve ser maior que zero e não pode exceder o valor da tipologia.</p>`,
    () => {
      const idx = +$('mdTip').value, it = c.itens.find(i => i.idx === idx);
      let v = num($('mdVal').value);

      o.valor = orcCalc(o).total; save(); render(); toast('Desconto aplicado com sucesso!');

function marcarVenda(oid) {

  DB.vendas.unshift({ id: uid(), obraId: oid, numero: o.numero, cliente: cl ? cl.nome : '', valor: c.total, data: hojeBR(), status: 'Em produção' });

}

function gerarLote() {
  const ids = Array.from(document.querySelectorAll('.lote-chk:checked')).map(x => x.value);
  if (!ids.length) { toast('Selecione ao menos uma obra.', 'erro'); return; }
  const P = {}, C = {};
  let kg = 0, kgC = 0;
  ids.forEach(id => {
    const m = materiaisObra(obraById(id));
    m.perfis.forEach(x => { const a = P[x.cod] || (P[x.cod] = { cod: x.cod, d: x.d, kg: 0, barras: 0 }); a.kg += x.kgObra; a.barras += x.barras; });
    m.comps.forEach(x => { const a = C[x.c] || (C[x.c] = { c: x.c, d: x.d, u: x.u, qtd: 0 }); a.qtd += x.qtd; });
    kg += m.kgObra; kgC += m.kgCompra;
  });
  $('loteRes').innerHTML = `<div class="bg-white rounded-lg shadow p-4">
    <h3 class="font-bold text-gray-700 mb-2">Plano consolidado (${ids.length} obra(s)) · ${fmt(kg, 3)} Kg líquido · ${fmt(kgC, 3)} Kg bruto</h3>
    <div class="overflow-x-auto border rounded"><table class="tbl w-full text-sm min-w-[480px]"><thead><tr><th>Perfil</th><th>Descrição</th><th class="text-right">Barras</th><th class="text-right">Kg</th></tr></thead>
    <tbody>${Object.values(P).map(x => `<tr><td class="font-bold">${x.cod}</td><td>${x.d}</td><td class="text-right">${x.barras}</td><td class="text-right">${fmt(x.kg, 3)}</td></tr>`).join('')}</tbody></table></div>
    <div class="overflow-x-auto border rounded mt-4"><table class="tbl w-full text-sm min-w-[480px]"><thead><tr><th>Componente</th><th>Descrição</th><th class="text-right">Qtd</th><th>Un.</th></tr></thead>
    <tbody>${Object.values(C).map(x => `<tr><td class="font-bold">${x.c}</td><td>${x.d}</td><td class="text-right">${fmt(x.qtd, Number.isInteger(x.qtd) ? 0 : 2)}</td><td>${x.u}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
  toast('Plano de produção gerado!');
}

};
